<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#070908" />
  <title>إحصائيات زوار كأس أغشوركيت</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#30110d 0,#120807 42%,#060606 100%);color:#fff;font-family:Cairo,system-ui,sans-serif;display:grid;place-items:center;padding:22px}.panel{width:min(760px,100%);background:rgba(14,14,14,.92);border:1px solid rgba(255,255,255,.09);border-radius:28px;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.45)}.eyebrow{color:#ffb28f;font-weight:800;font-size:13px}.title{font-size:clamp(28px,7vw,48px);line-height:1.15;margin:8px 0 8px}.sub{color:#a9aaa9;margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#111;border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:20px;text-align:center}.value{font-size:clamp(27px,7vw,46px);font-weight:900;letter-spacing:-1px}.label{font-size:13px;color:#aaa}.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px;color:#8f918f;font-size:12px}.status{display:inline-flex;align-items:center;gap:7px}.dot{width:8px;height:8px;border-radius:999px;background:#56e278;box-shadow:0 0 12px #56e278}.error{color:#ff9a91}@media(max-width:650px){.grid{grid-template-columns:1fr}.panel{padding:20px;border-radius:22px}.card{padding:16px}}
  </style>
</head>
<body>
  <main class="panel">
    <div class="eyebrow">إحصائيات الموقع</div>
    <h1 class="title">زوار كأس أغشوركيت</h1>
    <p class="sub">عداد منفصل لمتابعة عدد زوار الموقع.</p>
    <section class="grid">
      <article class="card"><div id="total" class="value">—</div><div class="label">إجمالي الزوار</div></article>
      <article class="card"><div id="week" class="value">—</div><div class="label">آخر 7 أيام</div></article>
      <article class="card"><div id="today" class="value">—</div><div class="label">زوار اليوم</div></article>
    </section>
    <div class="meta"><span id="state" class="status"><span class="dot"></span>متصل بقاعدة البيانات</span><span id="updated">آخر تحديث: —</span></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config.js"></script>
  <script>
    const fmt = new Intl.NumberFormat('ar-MR');
    const db = window.supabase.createClient(window.AGCH_CONFIG.supabaseUrl, window.AGCH_CONFIG.supabaseKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
    async function load(){
      const state=document.getElementById('state');
      try{
        const {data,error}=await db.rpc('site_visit_dashboard_stats');
        if(error) throw error;
        const row=Array.isArray(data)?data[0]:data;
        document.getElementById('total').textContent=fmt.format(Number(row?.total_visitors||0));
        document.getElementById('week').textContent=fmt.format(Number(row?.week_visitors||0));
        document.getElementById('today').textContent=fmt.format(Number(row?.today_visitors||0));
        document.getElementById('updated').textContent='آخر تحديث: '+new Date().toLocaleString('ar-MR');
      }catch(e){state.classList.add('error');state.textContent='تعذر تحميل الإحصائيات';}
    }
    load(); setInterval(load,30000);
  </script>
</body>
</html>
