<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>كأس أغشوركيت 2026</title><style>body{font-family:Tahoma,Arial;background:#f5f7f4;color:#071713;margin:0;padding:20px 14px 80px}.app{max-width:1000px;margin:auto}h1{margin:0 0 8px}.sub{color:#66736d;margin-bottom:18px}.tabs{display:flex;gap:8px;overflow:auto;margin:15px 0}.tabs button{border:1px solid #dfe5e1;background:white;padding:10px 18px;border-radius:999px;white-space:nowrap}.tabs .active{background:#071713;color:#fff}.search{width:100%;box-sizing:border-box;border:1px solid #dfe5e1;border-radius:16px;padding:14px;margin-bottom:14px;font:inherit}.grid{display:grid;gap:12px}.team{background:white;border:1px solid #dfe5e1;border-radius:18px;padding:0 14px}.team summary{padding:15px 0;font-weight:700;cursor:pointer}.team small{color:#77817d;font-weight:400;margin-right:8px}.team ol{border-top:1px solid #edf0ee;margin:0;padding:12px 30px 16px 0}.team li{padding:7px 0;line-height:1.5}.tag{font-size:11px;background:#e8f4ed;color:#0d5b3d;padding:3px 7px;border-radius:8px;margin-right:6px}@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><main class="app"><h1>كأس أغشوركيت 2026</h1><div class="sub">الفرق وقوائم اللاعبين الرسمية</div><div class="tabs"><button data-c="الكبار" class="active">الكبار</button><button data-c="الوسط">الوسط</button><button data-c="الصغار">الصغار</button></div><input id="q" class="search" placeholder="ابحث باسم الفريق أو اللاعب"><div id="count" class="sub"></div><div id="grid" class="grid"></div></main><script>
const D={
"الكبار":{
"الشهيد الدكتور محمد الأمين محمد المصطفى":["الشيخ أحمدو غلاوي","فؤاد ولد حيبتي","الداه ولد محمد اطفيل","عالي ولد معط لل","عبدالرحمن محمذن باب","الصديق محمذن باب","محمد ابييه","الشيخ يحيى غلاوي","أحمد ولد ابييه","محمد يسلم محمد حبيب","الندى ولد الندى","عزيز ولد الدي","الحسن ولد كبود","شكرود حيبلاه","معاذ باب","اينجيه محمد عبدالله","محمد محمود خليل","الطاهر ولد الحسن","محمد محمود انجاي",{"n":"دماه حاج محم","c":1},"محفوظ محمدا","حمدا محمد سيدي","سيدي ولد لميني","عبد الله ولد محمدي فال","عبد الله ولد كبود","الناجي ولد منجى"],
"الواد الغارك":[["المصطفى يعقوب",8],["ادوم من",10],["زايد محمد",3],["محمد طالب محمد",9],["الحسن ساليم",12],["اسماعيل موسى",2],["علين الشداد",7],["العمدة طراح",5],["محمد هارون",99,"حارس مرمى"],["الحسين شيخاني",55],["الزدف سيدي عثمان",11],["عبد الرحمن الحسين",20],["بوه الحسين",4],["باه لمام",69],["هارون نيناه",42],["شيخاني محمد",22],["محمد سالم عدود",30],["حمد عبد الودود",15],["احمد سيلومه",77],["بلاه محمد باب",19],["محمد بلال",6],["حمدي لبات",1,"حارس مرمى"]],
"نادي بغداد":[["محمد أحمد سالم",null,"حارس مرمى"],["التراد إحمد أسغير",null,"حارس مرمى"],["سيدي محمد اسغير",null,"دفاع"],["محمد أحمد",null,"دفاع"],["عبد الله تمبل",null,"دفاع"],["عمر أعبيد الله",null,"دفاع"],["بوه محفوظ",null,"دفاع"],["يحي مبروك",null,"دفاع"],["محمد حمد أمبارك",null,"دفاع"],["حمني أميس",null,"وسط",1],["محمد الأمين إبراهيم",null,"وسط"],["محمد سيدي",null,"وسط"],["عثمان أعثيميين",null,"وسط"],["محمد آميجن",null,"وسط"],["حمزة محمذن",null,"وسط"],["يحي",null,"وسط"],["عثمان أحمد",null,"هجوم"],["محمد أميجن",null,"هجوم"],["أحمد جمعه",null,"هجوم"],["محمد محمود",null,"هجوم"],["الداه أميس",null,"هجوم"]],
"الكبة":["الغزالي زيدان","كباد تمبل","أحمد سيدي"],"الهلال":[],"البلد الطيب":[],"بير البركة":[],"الحمد":[],"بوقبره":[],"نجوم لمدن":[]},
"الوسط":{},"الصغار":{}
};
let cat='الكبار';function P(x){if(typeof x==='string')return{name:x};if(Array.isArray(x))return{name:x[0],num:x[1],pos:x[2],cap:x[3]};return{name:x.n,cap:x.c}}function render(){let q=document.querySelector('#q').value.trim().toLowerCase(),entries=Object.entries(D[cat]).filter(([t,ps])=>!q||t.toLowerCase().includes(q)||ps.some(x=>P(x).name.toLowerCase().includes(q)));document.querySelector('#count').textContent=entries.length+' فريق';document.querySelector('#grid').innerHTML=entries.map(([t,ps])=>`<details class="team"><summary>${t}<small>${ps.length} لاعب</small></summary>${ps.length?`<ol>${ps.map(x=>{let p=P(x);return `<li>${p.num?`<b>${p.num}</b> — `:''}${p.name}${p.pos?` <span class="tag">${p.pos}</span>`:''}${p.cap?` <span class="tag">القائد</span>`:''}</li>`}).join('')}</ol>`:'<p class="sub">قائمة اللاعبين ستُستكمل من البيانات الرسمية.</p>'}</details>`).join('')}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelector('#q').oninput=render;render();
</script></body></html>
