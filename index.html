    <script src="config.js?v=20260902-mobileboot"></script>
    <script>
      (()=>{
        const main=document.getElementById('appMain');
        let appLoaded=false;
        const showBootError=(message)=>{
          if(!main?.querySelector('.loading-page'))return;
          main.innerHTML='<div class="page-shell"><div class="agh-boot-error"><b>تعذر إكمال تحميل الموقع</b><p>'+message+'</p><button type="button" id="aghBootRetry">إعادة المحاولة</button></div></div>';
          document.getElementById('aghBootRetry')?.addEventListener('click',()=>location.reload());
        };
        const loadScript=(src,timeout=5000)=>new Promise((resolve,reject)=>{
          const s=document.createElement('script');
          let done=false;
          const finish=(ok)=>{if(done)return;done=true;clearTimeout(timer);ok?resolve():reject(new Error('load failed: '+src));};
          s.src=src;s.async=true;s.onload=()=>finish(true);s.onerror=()=>finish(false);
          const timer=setTimeout(()=>{s.remove();finish(false)},timeout);
          document.body.appendChild(s);
        });
        const boot=async()=>{
          try{await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',4500)}
          catch(_){try{await loadScript('https://unpkg.com/@supabase/supabase-js@2',4500)}catch(__){}}
          try{await loadScript('public-app.js?v=20260902-mobileboot2',6000);appLoaded=true}
          catch(_){showBootError('تعذر تشغيل ملفات التطبيق. تحقق من الاتصال ثم أعد المحاولة.');return}
          loadScript('visit-tracker.js?v=20260902-shared-client',4000).catch(()=>{});
          loadScript('live-match-clock.js?v=20260902-shared-client',4000).catch(()=>{});
          loadScript('scorers-rank-fix.js?v=20260901-2',4000).catch(()=>{});
          setTimeout(()=>{if(main?.querySelector('.loading-page'))showBootError('استغرق جلب بيانات البطولة وقتًا أطول من اللازم. أعد المحاولة وسيتم تحميل نسخة جديدة بدون كاش قديم.')},12000);
        };
        window.addEventListener('error',()=>{if(!appLoaded)setTimeout(()=>showBootError('حدث خطأ أثناء بدء التطبيق. أعد المحاولة.'),50)});
        boot();
      })();
    </script>
