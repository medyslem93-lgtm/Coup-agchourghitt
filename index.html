<style>
:root{--bg:#06100d;--bg2:#091914;--panel:#0d1d18;--panel2:#12271f;--line:#203b31;--emerald:#0f8b62;--emerald2:#1bb77f;--gold:#d9b45c;--text:#f8faf7;--muted:#95a69f;--red:#ef5a5a;--yellow:#f4c95d;--green:#72dda3;--r:22px}*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;font-family:Tahoma,Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 15% 0%,rgba(17,132,94,.20),transparent 28%),linear-gradient(180deg,var(--bg2),var(--bg));min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}img{max-width:100%}.app{max-width:1180px;margin:auto;min-height:100vh}.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:rgba(6,16,13,.90);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.06)}.brand{display:flex;align-items:center;gap:9px}.brand img{width:40px;height:40px;object-fit:contain;background:#fff;border-radius:13px;padding:3px}.brand b{display:block;font-size:14px}.brand small{color:var(--gold);font-size:10px}.iconbtn{width:40px;height:40px;border:1px solid var(--line);border-radius:13px;background:var(--panel);color:#fff}.main{padding:14px 14px 94px}.page{display:none}.page.active{display:block}.hero,.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}.hero{padding:16px;background:linear-gradient(135deg,rgba(15,139,98,.28),rgba(217,180,92,.08)),var(--panel)}.hero-in{display:flex;align-items:center;justify-content:space-between;gap:12px}.hero h1{font-size:20px;margin:0 0 6px}.hero p{margin:0;color:var(--muted);font-size:12px}.hero-logo{width:78px;height:78px;object-fit:contain;background:white;border-radius:20px;padding:5px}.section{margin-top:18px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.head h2{font-size:17px;margin:0}.head button{border:0;background:transparent;color:var(--gold)}.filters,.scroll{display:flex;gap:8px;overflow:auto}.filter{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:8px 12px;border-radius:999px;white-space:nowrap}.filter.active{background:#174338;color:#fff}.match-main{padding:14px}.match-meta,.match-footer{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.match-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:9px}.team{text-align:center;min-width:0}.team img{width:58px;height:58px;object-fit:contain;background:#fff;border-radius:16px;padding:4px}.team b{display:block;margin-top:6px;font-size:12px}.vs{font-size:22px;font-weight:900}.compact-match{min-width:278px;padding:12px}.search{width:100%;border:1px solid var(--line);background:var(--panel);color:#fff;padding:12px 13px;border-radius:15px}.teamgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.teamcard{padding:13px;text-align:center;color:#fff}.teamcard img{width:74px;height:74px;object-fit:contain;background:#fff;border-radius:19px;padding:5px}.teamcard h3{font-size:13px;margin:8px 0 4px}.teamcard p{font-size:10px;color:var(--muted);margin:0}.sheet{position:fixed;z-index:100;inset:0;background:rgba(0,0,0,.62);display:none;align-items:flex-end}.sheet.show{display:flex}.sheet-panel{width:100%;max-height:92vh;overflow:auto;background:#091813;border-top:1px solid #2b4a3d;border-radius:26px 26px 0 0;padding:16px}.backrow{display:flex;justify-content:space-between;margin-bottom:12px}.backrow button{border:1px solid var(--line);background:var(--panel);color:#fff;border-radius:12px;padding:8px 10px}.playerlist{display:grid;gap:7px}.player{display:flex;align-items:center;gap:10px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px}.mini-avatar{width:42px;height:42px;border-radius:12px;background:#16372c;color:var(--gold);display:grid;place-items:center;font-weight:800}.note{padding:12px;border:1px dashed #35594b;border-radius:14px;color:var(--muted);font-size:11px}.player-profile{padding:0 0 8px}.player-cover{position:relative;overflow:hidden;border-radius:26px;padding:18px;background:radial-gradient(circle at 20% 20%,rgba(217,180,92,.18),transparent 28%),linear-gradient(145deg,#123e30 0%,#0a2119 46%,#07120e 100%);border:1px solid #315447}.player-actions{display:flex;justify-content:space-between;position:relative;z-index:2;margin-bottom:8px}.player-actions button{width:40px;height:40px;border:1px solid #345649;background:rgba(7,20,15,.68);color:#fff;border-radius:13px}.player-identity{display:grid;grid-template-columns:108px 1fr;gap:15px;align-items:end;position:relative;z-index:2}.player-photo{width:108px;height:138px;border-radius:24px 24px 18px 18px;background:linear-gradient(160deg,#193e31,#0b2119);border:1px solid #416554;display:grid;place-items:center;overflow:hidden}.player-photo .neutral{font-size:42px;font-weight:900;color:var(--gold)}.player-info h2{font-size:24px;line-height:1.35;margin:0 0 8px}.player-teamline{display:flex;align-items:center;gap:8px;font-size:12px}.player-teamline img{width:32px;height:32px;object-fit:contain;background:#fff;border-radius:9px;padding:2px}.player-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.meta-chip{padding:6px 9px;border:1px solid #35584b;background:rgba(11,32,24,.7);border-radius:999px;font-size:10px;color:#bfd0c8}.player-primary-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:15px}.player-primary-stats .ps{background:rgba(6,20,15,.75);border:1px solid #2d5143;border-radius:15px;padding:11px 4px;text-align:center}.player-primary-stats .ps b{display:block;font-size:20px}.player-primary-stats .ps span{font-size:9px;color:#9db0a7}.player-tabs{display:flex;gap:7px;overflow:auto;margin:14px 0 10px}.player-tabs button{white-space:nowrap;border:1px solid var(--line);background:#0d1f18;color:var(--muted);padding:9px 12px;border-radius:13px}.player-tabs button.active{background:linear-gradient(135deg,#1c493a,#16372d);color:#fff}.player-panel{display:none}.player-panel.active{display:block}.profile-card{padding:13px;margin-bottom:10px}.profile-card h3{margin:0 0 10px;font-size:14px}.info-list{display:grid;gap:8px}.info-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:11px}.info-row span{color:var(--muted)}.visual-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.visual-stat{background:#10241c;border:1px solid #294a3c;border-radius:16px;padding:13px}.visual-stat b{font-size:22px;display:block}.visual-stat span{font-size:10px;color:var(--muted)}.discipline-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.discipline-card{padding:13px 7px;border-radius:15px;background:#10231c;border:1px solid #29473b;text-align:center}.discipline-card b{display:block;font-size:20px}.discipline-card span{font-size:9px;color:var(--muted)}.empty{padding:24px 16px;text-align:center;color:var(--muted)}.empty b{display:block;color:#fff;margin-bottom:7px}.nav{position:fixed;z-index:80;bottom:8px;left:50%;transform:translateX(-50%);width:min(94%,540px);background:rgba(9,25,20,.95);border:1px solid #28483b;border-radius:21px;padding:7px;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{border:0;background:transparent;color:var(--muted);padding:8px 3px;border-radius:14px;font-size:10px}.nav button.active{background:rgba(15,139,98,.35);color:#fff}@media(min-width:768px){.teamgrid{grid-template-columns:repeat(4,1fr)}}@media(min-width:1024px){.nav{display:none}.sheet{align-items:center;justify-content:center;padding:30px}.sheet-panel{max-width:820px;border-radius:26px}.teamgrid{grid-template-columns:repeat(5,1fr)}}
</style></head>
<body>
<div class="app"><header class="topbar"><div class="brand"><img src="assets/tournament.jpg"><div><b>كأس أغشوركيت</b><small>2026</small></div></div><button class="iconbtn" onclick="go('teams')">⌕</button></header><main class="main"><section id="home" class="page active"><div class="hero"><div class="hero-in"><div><h1>كأس أغشوركيت 2026</h1><p>المنصة الرسمية للبطولة</p></div><img class="hero-logo" src="assets/tournament.jpg"></div></div><div class="section"><div class="head"><h2>الفرق واللاعبون</h2><button onclick="go('teams')">عرض الكل</button></div><div class="card empty"><b>بروفايلات اللاعبين جاهزة</b>اضغط على الفرق ثم أي لاعب لفتح صفحته الاحترافية.</div></div></section><section id="teams" class="page"><input id="teamSearch" class="search" placeholder="ابحث عن فريق أو لاعب"><div class="filters"><button class="filter active" data-teamcat="الكل">الكل</button><button class="filter" data-teamcat="الكبار">الكبار</button><button class="filter" data-teamcat="الوسط">الوسط</button><button class="filter" data-teamcat="الصغار">الصغار</button></div><div id="teamGrid" class="teamgrid"></div></section><section id="matches" class="page"><div class="card empty"><b>المباريات</b>المباريات المجدولة تظهر من البيانات الرسمية فقط.</div></section><section id="tournament" class="page"><div class="card empty"><b>البطولة</b>جميع الإحصائيات تبدأ من الصفر.</div></section><section id="more" class="page"><div class="card empty"><b>نسخة الجمهور</b>لوحة الإدارة منفصلة.</div></section></main></div>
<nav class="nav"><button class="active" data-page="home">الرئيسية</button><button data-page="matches">المباريات</button><button data-page="tournament">البطولة</button><button data-page="teams">الفرق</button><button data-page="more">المزيد</button></nav><div id="sheet" class="sheet" onclick="if(event.target===this)closeSheet()"><div id="sheetPanel" class="sheet-panel"></div></div>
<script>
const logoBase='assets/logos/';const logoMap={'الشهيد الدكتور محمد الأمين محمد المصطفى':'martyr.jpg','الحمد':'alhamd.jpg','البلد الطيب':'balad_tayib.jpg','بير البركة':'bir_baraka.jpg','الكبة':'alkabba.jpg','الهلال':'hilal.jpg','الواد الغارگ':'wadi_gharig.png','نجوم لمدن':'noujoum_lmdn.png','بوقبره':'bou_gabra.jpg','بغداد':'baghdad.jpg'};const fallback='assets/tournament.jpg';const logo=n=>logoMap[n]?logoBase+logoMap[n]:fallback;const groups={A:['الشهيد الدكتور محمد الأمين محمد المصطفى','الهلال','الواد الغارگ','بغداد'],B:['البلد الطيب','بير البركة','الحمد'],C:['بوقبره','نجوم لمدن','الكبة']};const seniorMatches=[{date:'2026-08-22',time:'17:30',a:'الشهيد الدكتور محمد الأمين محمد المصطفى',b:'الهلال'},{date:'2026-08-23',time:'17:30',a:'الحمد',b:'بير البركة'},{date:'2026-08-24',time:'17:30',a:'بوقبره',b:'الكبة'},{date:'2026-08-25',time:'17:30',a:'الواد الغارگ',b:'بغداد'}];let D={الكبار:{},الوسط:{},الصغار:{}};function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===id));scrollTo(0,0)}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));async function loadRosters(){try{let t=await fetch('rosters.html',{cache:'no-store'}).then(r=>r.text()),m=t.match(/const D=(\{[\s\S]*?\})\s*;let cat=/);if(m)D=Function('return ('+m[1]+')')()}catch(e){}renderTeams()}function pname(p){return typeof p==='string'?p:(p?.name||p?.n||'')}function pnum(p){return typeof p==='object'&&p?String(p.num??p.number??p.no??'').trim():''}function ppos(p){return typeof p==='object'&&p?String(p.pos??p.position??'').trim():''}function playerObject(name,team,cat){return (D[cat]?.[team]||[]).find(p=>pname(p)===name)||name}function teamGroup(team){return groups.A.includes(team)?'المجموعة A':groups.B.includes(team)?'المجموعة B':groups.C.includes(team)?'المجموعة C':'غير مسجلة'}function teamUpcoming(team){return seniorMatches.filter(m=>m.a===team||m.b===team)}function renderTeams(){const q=(teamSearch.value||'').trim().toLowerCase(),c=document.querySelector('[data-teamcat].active')?.dataset.teamcat||'الكل';let rows=[];Object.entries(D).forEach(([cat,ts])=>{if(c!=='الكل'&&c!==cat)return;Object.entries(ts).forEach(([n,ps])=>{if(!q||n.toLowerCase().includes(q)||ps.some(p=>pname(p).toLowerCase().includes(q)))rows.push({cat,n,ps})})});teamGrid.innerHTML=rows.map(x=>`<button class="card teamcard" onclick="openTeam('${x.n.replaceAll("'","\\'")}','${x.cat}')"><img src="${logo(x.n)}"><h3>${x.n}</h3><p>${x.cat} · ${x.ps.length} لاعب</p></button>`).join('')}document.querySelectorAll('[data-teamcat]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-teamcat]').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderTeams()});teamSearch.oninput=renderTeams;function showSheet(h){sheetPanel.innerHTML=h;sheet.classList.add('show')}function closeSheet(){sheet.classList.remove('show')}function initial(n){return(n.trim()[0]||'؟')}function openTeam(n,cat){const ps=D[cat]?.[n]||[];showSheet(`<div class="backrow"><button onclick="closeSheet()">إغلاق</button></div><div class="hero"><div class="hero-in"><div><h1>${n}</h1><p>${cat} · ${teamGroup(n)}</p></div><img class="hero-logo" src="${logo(n)}"></div></div><div class="section"><div class="head"><h2>اللاعبون</h2></div><div class="playerlist">${ps.map(p=>{let x=pname(p);return`<button class="player" style="color:#fff;text-align:right" onclick="openPlayer('${x.replaceAll("'","\\'")}','${n.replaceAll("'","\\'")}','${cat}')"><div class="mini-avatar">${initial(x)}</div><div><b>${x}</b><small style="display:block;color:var(--muted)">اضغط لفتح البروفايل</small></div></button>`}).join('')}</div></div>`)}function openPlayer(n,team,cat){const raw=playerObject(n,team,cat),num=pnum(raw),pos=ppos(raw),upcoming=teamUpcoming(team);showSheet(`<div class="player-profile"><div class="player-cover"><div class="player-actions"><button onclick="openTeam('${team.replaceAll("'","\\'")}','${cat}')">←</button><button onclick="shareText('${n} - ${team}')">↗</button></div><div class="player-identity"><div class="player-photo"><div class="neutral">${initial(n)}</div></div><div class="player-info"><h2>${n}</h2><div class="player-teamline"><img src="${logo(team)}"><b>${team}</b></div><div class="player-meta">${num?`<span class="meta-chip">الرقم ${num}</span>`:''}${pos?`<span class="meta-chip">${pos}</span>`:''}<span class="meta-chip">${teamGroup(team)}</span></div></div></div><div class="player-primary-stats"><div class="ps"><b>0</b><span>المباريات</span></div><div class="ps"><b>0</b><span>الأهداف</span></div><div class="ps"><b>0</b><span>التمريرات الحاسمة</span></div><div class="ps"><b>0</b><span>رجل المباراة</span></div></div></div><div class="player-tabs"><button class="active" onclick="playerTab('overview',this)">نظرة عامة</button><button onclick="playerTab('matches',this)">المباريات</button><button onclick="playerTab('stats',this)">الإحصائيات</button><button onclick="playerTab('discipline',this)">الانضباط</button></div><div id="player-overview" class="player-panel active"><div class="card profile-card"><h3>معلومات اللاعب</h3><div class="info-list"><div class="info-row"><span>الفريق</span><b>${team}</b></div><div class="info-row"><span>رقم القميص</span><b>${num||'غير مسجل'}</b></div><div class="info-row"><span>المركز</span><b>${pos||'غير مسجل'}</b></div><div class="info-row"><span>المجموعة</span><b>${teamGroup(team)}</b></div></div></div><div class="card empty"><b>لا توجد أخبار مرتبطة باللاعب</b>لن يتم إنشاء أخبار تلقائيًا.</div></div><div id="player-matches" class="player-panel"><div class="card profile-card"><h3>المباريات القادمة</h3>${upcoming.length?upcoming.map(m=>`<div class="card compact-match" style="margin-bottom:8px"><div class="match-row"><div class="team"><img src="${logo(m.a)}"><b>${m.a}</b></div><div class="vs">VS</div><div class="team"><img src="${logo(m.b)}"><b>${m.b}</b></div></div><div class="match-footer"><span>${m.date}</span><span>${m.time}</span></div></div>`).join(''):'<div class="empty">لا توجد مباريات قادمة مسجلة.</div>'}</div></div><div id="player-stats" class="player-panel"><div class="card profile-card"><h3>إحصائيات البطولة</h3><div class="visual-stats"><div class="visual-stat"><b>0</b><span>المباريات</span></div><div class="visual-stat"><b>0</b><span>المشاركات الأساسية</span></div><div class="visual-stat"><b>0</b><span>الدخول كبديل</span></div><div class="visual-stat"><b>0</b><span>الأهداف</span></div><div class="visual-stat"><b>0</b><span>التمريرات الحاسمة</span></div><div class="visual-stat"><b>0</b><span>رجل المباراة</span></div></div></div><div class="note">البطولة لم تبدأ بعد — سيتم تحديث الإحصائيات من أحداث المباريات الحقيقية فقط.</div></div><div id="player-discipline" class="player-panel"><div class="card profile-card"><h3>الانضباط</h3><div class="discipline-cards"><div class="discipline-card"><b>0</b><span>البطاقات الصفراء</span></div><div class="discipline-card"><b>0</b><span>البطاقات الحمراء</span></div><div class="discipline-card"><b>0</b><span>الإيقافات</span></div></div></div><div class="card empty"><b>لا يوجد إيقاف مسجل</b>أي إيقاف سيظهر هنا بناءً على بيانات حقيقية فقط.</div></div></div>`)}function playerTab(id,btn){document.querySelectorAll('.player-panel').forEach(x=>x.classList.remove('active'));document.getElementById('player-'+id)?.classList.add('active');document.querySelectorAll('.player-tabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}function shareText(t){if(navigator.share)navigator.share({title:t,text:t,url:location.href}).catch(()=>{});else navigator.clipboard?.writeText(location.href)}loadRosters();
</script></body></html>
