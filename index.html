<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>كأس أغشوركيت 2026</title>
<style>html,body{margin:0;height:100%;background:#f5f7f4}iframe{border:0;width:100%;height:100vh;display:block}</style>
</head>
<body>
<iframe id="app" src="rosters.html" title="كأس أغشوركيت 2026"></iframe>
<script>
const logos={
"الشهيد الدكتور محمد الأمين محمد المصطفى":"assets/logos/martyr.jpg",
"الحمد":"assets/logos/alhamd.jpg",
"البلد الطيب":"assets/logos/balad_tayib.jpg",
"بير البركة":"assets/logos/bir_baraka.jpg",
"الكبة":"assets/logos/alkabba.jpg",
"الهلال":"assets/logos/hilal.jpg",
"الواد الغارك":"assets/logos/wadi_gharig.jpg",
"الواد الغارگ":"assets/logos/wadi_gharig.jpg",
"نجوم لمدن":"assets/logos/noujoum_lmdn.jpg",
"بوقبره":"assets/logos/bou_gabra.jpg",
"بغداد":"assets/logos/baghdad.jpg",
"نادي بغداد":"assets/logos/baghdad.jpg"
};
const f=document.getElementById('app');
function applyLogos(){
 const d=f.contentDocument;if(!d)return;
 if(!d.getElementById('logoStyle')){const s=d.createElement('style');s.id='logoStyle';s.textContent='.team summary{display:flex;align-items:center;gap:10px}.team-logo{width:48px;height:48px;object-fit:contain;border-radius:12px;background:#fff;border:1px solid #e1e7e3;padding:3px;flex:none}';d.head.appendChild(s)}
 const active=d.querySelector('.tabs .active')?.dataset.c;if(active!=='الكبار')return;
 d.querySelectorAll('.team').forEach(card=>{const sum=card.querySelector('summary');if(!sum||sum.querySelector('.team-logo'))return;const txt=[...sum.childNodes].find(n=>n.nodeType===3&&n.textContent.trim());const name=(txt?txt.textContent:sum.textContent).trim();const src=logos[name];if(!src)return;const img=d.createElement('img');img.src=src;img.alt='شعار '+name;img.className='team-logo';sum.prepend(img)})
}
f.addEventListener('load',()=>{applyLogos();const d=f.contentDocument;if(d)new MutationObserver(applyLogos).observe(d.getElementById('grid')||d.body,{childList:true,subtree:true})});
</script>
</body></html>
