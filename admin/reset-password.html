<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>تغيير كلمة المرور | كأس أغشوركيت</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#07110d;color:#f6f4ea;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}.card{width:min(440px,100%);background:#101d17;border:1px solid #294333;border-radius:28px;padding:28px;box-shadow:0 24px 70px #0008}.logo{width:82px;height:82px;border-radius:22px;object-fit:cover;display:block;margin:0 auto 18px;border:2px solid #c9a84b}h1{text-align:center;margin:0 0 8px;font-size:27px}.sub{text-align:center;color:#aebbb4;margin:0 0 24px;line-height:1.7}label{display:block;margin:14px 0 7px;font-weight:700}input{width:100%;padding:15px;border-radius:14px;border:1px solid #385044;background:#07110d;color:white;font-size:16px;outline:none}input:focus{border-color:#d3b35c}button{width:100%;margin-top:20px;padding:15px;border:0;border-radius:14px;background:#c8a84f;color:#10140f;font-weight:900;font-size:17px;cursor:pointer}button:disabled{opacity:.55}.msg{display:none;margin-top:16px;padding:12px;border-radius:12px;line-height:1.6}.msg.on{display:block}.ok{background:#173c2a}.bad{background:#4a2020}.link{display:block;text-align:center;color:#d6bb70;margin-top:18px;text-decoration:none}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="../assets/tournament.jpg" alt="كأس أغشوركيت">
    <h1>إنشاء كلمة مرور جديدة</h1>
    <p class="sub" id="intro">افتح هذه الصفحة من رابط الاستعادة المرسل إلى بريد المسؤول، ثم أدخل كلمة المرور الجديدة.</p>
    <form id="form">
      <label for="password">كلمة المرور الجديدة</label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" required>
      <label for="confirm">تأكيد كلمة المرور</label>
      <input id="confirm" type="password" autocomplete="new-password" minlength="8" required>
      <button id="save" type="submit">حفظ كلمة المرور</button>
    </form>
    <div id="msg" class="msg"></div>
    <a class="link" href="/admin/login.html">العودة إلى تسجيل دخول الإدارة</a>
  </main>
  <script src="../vendor/supabase.js?v=2.116.0"></script>
  <script src="../config.js"></script>
  <script>
  (()=>{
    const sb=window.AGCH_SUPABASE_CLIENT || window.supabase.createClient(window.AGCH_CONFIG.supabaseUrl,window.AGCH_CONFIG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    const form=document.getElementById('form'), pass=document.getElementById('password'), confirm=document.getElementById('confirm'), save=document.getElementById('save'), msg=document.getElementById('msg');
    const show=(text,ok=false)=>{msg.textContent=text;msg.className='msg on '+(ok?'ok':'bad')};
    let recoveryReady=false;
    sb.auth.onAuthStateChange((event,session)=>{
      if(event==='PASSWORD_RECOVERY' || (session && location.hash.includes('type=recovery'))) recoveryReady=true;
    });
    setTimeout(async()=>{
      const {data:{session}}=await sb.auth.getSession();
      if(session) recoveryReady=true;
      if(!recoveryReady) show('إذا وصلت إلى هنا مباشرة، اطلب رسالة استعادة جديدة وافتح الرابط الموجود فيها.');
    },900);
    form.addEventListener('submit',async(e)=>{
      e.preventDefault();
      if(pass.value.length<8){show('يجب أن تتكون كلمة المرور من 8 أحرف على الأقل.');return}
      if(pass.value!==confirm.value){show('كلمتا المرور غير متطابقتين.');return}
      save.disabled=true;save.textContent='جارٍ الحفظ...';
      try{
        const {data:{session}}=await sb.auth.getSession();
        if(!session && !recoveryReady) throw new Error('رابط الاستعادة غير صالح أو انتهت صلاحيته. اطلب رسالة جديدة.');
        const {error}=await sb.auth.updateUser({password:pass.value});
        if(error) throw error;
        show('تم تغيير كلمة المرور بنجاح. سيتم تحويلك إلى تسجيل الدخول.',true);
        setTimeout(()=>location.replace('/admin/login.html'),1800);
      }catch(err){show(err?.message||'تعذر تغيير كلمة المرور. اطلب رابط استعادة جديدًا.');save.disabled=false;save.textContent='حفظ كلمة المرور'}
    });
  })();
  </script>
</body>
</html>
