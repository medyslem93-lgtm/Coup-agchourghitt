<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071a14"><title>لوحة إدارة كأس أغشوركيت 2026</title><style>:root{--b:#07110e;--p:#0d1d18;--e:#0d8b63;--g:#d9b45c;--t:#f7f8f5;--m:#91a29b;--l:#20362f}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at 20% 0,rgba(13,139,99,.22),transparent 30%),var(--b);color:var(--t);min-height:100vh}.app{max-width:920px;margin:auto;padding:16px 14px 40px}.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}.top img{width:58px;height:58px;object-fit:contain;background:#fff;border-radius:17px;padding:4px}.top h1{font-size:20px;margin:0}.top p{margin:4px 0 0;color:var(--m);font-size:12px}.hero,.card{background:var(--p);border:1px solid var(--l);border-radius:20px}.hero{padding:16px;margin-bottom:16px}.hero b{display:block;font-size:17px}.hero span{color:var(--g);font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.act{background:var(--p);border:1px solid var(--l);color:#fff;border-radius:18px;padding:18px;text-align:right;min-height:96px}.act b{display:block;font-size:15px}.act small{display:block;color:var(--m);margin-top:7px;line-height:1.5}.section{margin-top:18px}.section h2{font-size:17px}.sheet{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end}.sheet.on{display:flex}.panel{width:100%;max-height:88vh;overflow:auto;background:#0a1713;border-radius:25px 25px 0 0;padding:18px}.panel label{display:block;color:var(--m);font-size:12px;margin:10px 0 5px}.panel input,.panel select{width:100%;background:#10231c;color:#fff;border:1px solid var(--l);padding:12px;border-radius:12px}.primary{width:100%;border:0;background:linear-gradient(135deg,var(--e),#08634a);color:#fff;padding:13px;border-radius:13px;margin-top:14px}.note{padding:16px;color:var(--m);line-height:1.7}.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#17382d;padding:10px 13px;border-radius:12px;opacity:0;transition:.2s}.toast.on{opacity:1}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}</style></head><body><main class="app"><div class="top"><img src="../assets/tournament.jpg"><div><h1>لوحة إدارة كأس أغشوركيت 2026</h1><p>رابط إداري مستقل عن الموقع العام</p></div></div><div class="hero"><b>إدارة البطولة من الهاتف</b><span>مباريات · أحداث · فرق · لاعبين · صور</span></div><div class="grid"><button class="act" onclick="goal()"><b>إضافة هدف</b><small>اختيار الفريق والمسجل والصانع والدقيقة</small></button><button class="act" onclick="eventSheet()"><b>بطاقة / حدث</b><small>تسجيل سريع للأحداث</small></button><button class="act" onclick="toast('إنشاء مباراة يحتاج ربط قاعدة البيانات')"><b>إضافة مباراة</b><small>إنشاء مباراة جديدة</small></button><button class="act" onclick="toast('رفع الصور يحتاج تخزينًا دائمًا')"><b>رفع صورة</b><small>كاميرا الهاتف أو الصور</small></button><button class="act" onclick="toast('رجل المباراة سيُربط ببيانات المباراة الرسمية')"><b>رجل المباراة</b><small>اختيار اللاعب بعد المباراة</small></button><button class="act" onclick="toast('إنهاء المباراة متاح بعد ربط Live Match Control')"><b>إنهاء المباراة</b><small>إغلاق المباراة وتثبيت النتيجة</small></button></div><div class="section"><h2>إدارة الفرق واللاعبين</h2><div class="grid"><button class="act"><b>الفرق</b><small>تعديل الفريق ورفع الشعار</small></button><button class="act"><b>اللاعبون</b><small>إضافة وتعديل الرقم والمركز</small></button><button class="act"><b>الأخبار</b><small>نشر أخبار البطولة</small></button></div></div><div class="card note section"><b style="color:#fff">تنبيه</b><br>هذه الصفحة مفصولة الآن عن الموقع العام. الصلاحيات وتخزين التغييرات الدائم وتحديث الترتيب تلقائيًا تحتاج ربط قاعدة بيانات وحساب إدارة.</div></main><div id="sheet" class="sheet" onclick="if(event.target===this)this.classList.remove('on')"><div id="panel" class="panel"></div></div><div id="toast" class="toast"></div><script>function show(x){panel.innerHTML=x;sheet.classList.add('on')}function goal(){show(`<h3>إضافة هدف</h3><label>الفريق</label><select><option>اختر الفريق</option></select><label>المسجل</label><input placeholder="اسم اللاعب"><label>الصانع</label><input placeholder="اختياري"><label>الدقيقة</label><input type="number"><label>نوع الهدف</label><select><option>عادي</option><option>ركلة جزاء</option><option>هدف عكسي</option></select><button class="primary" onclick="toast('تم الحفظ محليًا فقط');sheet.classList.remove('on')">حفظ الهدف</button>`)}function eventSheet(){show(`<h3>حدث سريع</h3><label>النوع</label><select><option>بطاقة صفراء</option><option>بطاقة حمراء</option><option>تبديل</option><option>حدث آخر</option></select><label>اللاعب</label><input><label>الدقيقة</label><input type="number"><button class="primary" onclick="toast('تم الحفظ محليًا فقط');sheet.classList.remove('on')">حفظ الحدث</button>`)}function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}</script></body></html>
