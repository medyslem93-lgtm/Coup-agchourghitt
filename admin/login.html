<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#070908" />
  <title>تسجيل دخول الإدارة | كأس أغشوركيت 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="admin-polish.css" />
  <link rel="stylesheet" href="admin-premium.css?v=20260901" />
  <style>
    .login-form{display:grid;gap:12px;margin-top:18px}.login-form label{font-weight:800;text-align:right}.login-form input{width:100%;box-sizing:border-box;border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:14px 16px;background:#111;color:#fff;font:inherit;outline:none}.login-form input:focus{border-color:#d6a84b;box-shadow:0 0 0 3px rgba(214,168,75,.15)}.login-form button{border:0;cursor:pointer;width:100%}.login-status{min-height:24px;margin:4px 0 0;font-size:.92rem}.login-status.error{color:#ff8585}.login-status.ok{color:#7ee2a8}.login-help{opacity:.72;font-size:.88rem}.text-button{background:transparent!important;color:#d6a84b!important;padding:8px;font:inherit;font-weight:800}.hidden{display:none!important}
  </style>
</head>
<body class="login-body">
  <main class="login-card">
    <img src="../assets/tournament.jpg" alt="شعار البطولة" />
    <span class="kicker">ADMIN CONTROL CENTER</span>
    <h1 id="pageTitle">إدارة كأس أغشوركيت 2026</h1>
    <p id="pageIntro">سجّل الدخول ببريدك الإلكتروني وكلمة المرور للوصول إلى لوحة الإدارة.</p>

    <form id="adminLogin" class="login-form">
      <label for="email">البريد الإلكتروني</label>
      <input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com" required />
      <label for="password">كلمة المرور</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required minlength="6" />
      <button id="loginButton" class="primary" type="submit">دخول إلى لوحة الإدارة</button>
      <button id="forgotPassword" class="text-button" type="button">نسيت كلمة المرور؟</button>
      <p id="loginStatus" class="login-status" role="status" aria-live="polite"></p>
      <small class="login-help">يجب أن يكون البريد مسجلاً مسبقاً في نظام إدارة البطولة.</small>
    </form>

    <form id="updatePasswordForm" class="login-form hidden">
      <label for="newPassword">كلمة المرور الجديدة</label>
      <input id="newPassword" type="password" autocomplete="new-password" placeholder="أدخل كلمة مرور جديدة" required minlength="8" />
      <label for="confirmPassword">تأكيد كلمة المرور</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="أعد كتابة كلمة المرور" required minlength="8" />
      <button id="updatePasswordButton" class="primary" type="submit">حفظ كلمة المرور الجديدة</button>
      <p id="recoveryStatus" class="login-status" role="status" aria-live="polite"></p>
    </form>

    <a class="primary" style="display:block;text-align:center;text-decoration:none;margin-top:14px" href="../">العودة إلى الموقع العام</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="login.js?v=20260901-reset1"></script>
</body>
</html>
