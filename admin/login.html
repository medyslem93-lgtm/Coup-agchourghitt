<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#060806"><title>دخول إدارة كأس أغشوركيت</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head><body class="login-body"><main class="login-card"><img src="../assets/tournament.jpg" alt="شعار البطولة"><span class="kicker">ADMIN CONTROL CENTER</span><h1>إدارة كأس أغشوركيت 2026</h1><p>هذه الصفحة مخصصة للمسؤول المعتمد فقط. سجّل الدخول بحساب الإدارة.</p><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" placeholder="البريد الإلكتروني"><label>كلمة المرور <small>(إذا كان لديك حساب بكلمة مرور)</small></label><input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور"><button id="loginPassword" class="primary">تسجيل الدخول</button><button id="magicLink" class="ghost">إرسال رابط دخول آمن إلى البريد</button><button id="createAccount" class="linkbtn">إنشاء حساب الإدارة لأول مرة بالبريد وكلمة المرور</button><div id="msg" class="login-msg"></div><a href="../" class="back-link">العودة إلى الموقع العام</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script>
const cfg=AGCH_CONFIG,sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true}}),$=id=>document.getElementById(id);function msg(t,ok=false){$('msg').textContent=t;$('msg').className='login-msg '+(ok?'ok':'err')}async function isAdmin(){const {data:{session}}=await sb.auth.getSession();if(!session)return false;const {data,error}=await sb.from('admin_emails').select('email').limit(1);return !error&&data&&data.length>0}async function enter(){if(await isAdmin())location.replace('./')}enter();$('loginPassword').onclick=async()=>{msg('جارٍ تسجيل الدخول...');const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return msg('تعذر تسجيل الدخول: '+error.message);if(await isAdmin())location.replace('./');else{await sb.auth.signOut();msg('هذا الحساب غير مخول لإدارة البطولة.')}};$('magicLink').onclick=async()=>{const email=$('email').value.trim();if(!email)return msg('أدخل البريد الإلكتروني أولًا.');msg('جارٍ إرسال رابط الدخول...');const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true,emailRedirectTo:location.origin+location.pathname.replace(/login\.html$/,'')}});if(error)msg('تعذر إرسال الرابط: '+error.message);else msg('تم إرسال رابط الدخول إلى بريدك. افتحه من نفس الجهاز.',true)};$('createAccount').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||password.length<6)return msg('أدخل بريدًا وكلمة مرور من 6 أحرف على الأقل.');msg('جارٍ إنشاء الحساب...');const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname.replace(/login\.html$/,'')}});if(error)return msg('تعذر إنشاء الحساب: '+error.message);if(data.session&&await isAdmin())location.replace('./');else msg('تم إنشاء الحساب. إذا طُلب تأكيد البريد فافتح رسالة التأكيد ثم ارجع هنا.',true)};
</script></body></html>
